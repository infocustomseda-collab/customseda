# Deploys master to production, then to staging (which reads production's database, so it follows
# the deploy that migrated it). CMS publishes dispatch production only. Both deploys share one queue
# on that database; a newer run waits (and replaces an older waiting run), so bursts of publishes
# coalesce. See docs/deployment.md.
name: Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy from master
        type: choice
        options: [staging, production]
      reason:
        description: Why (set by CMS publish triggers)
        type: string
        required: false

permissions:
  contents: read

# CMS dispatches for one environment coalesce here, before any job starts: at most one runs and one
# waits per environment. Pushes are never grouped, so every push is verified.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', inputs.environment) || format('push-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  verify:
    # PRs and pushes verify; dispatches deploy master, which its push already verified.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck

  production:
    needs: [verify]
    # Skipped (not failed) until the supervised first production setup turns this variable on.
    if: >-
      !cancelled() && vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped') &&
      (github.event_name == 'push' || inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production-db
      cancel-in-progress: false
    steps:
      # Always the current master: a run that waited in the queue must not deploy an older commit.
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Derivatives are keyed by content hash; reuse them across runs.
      - uses: actions/cache@v4
        with:
          path: .cache/media
          key: media-production-${{ github.run_id }}
          restore-keys: media-production-
      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EMDASH_EXPECTED_TARGET_FINGERPRINT: ${{ vars.EMDASH_TARGET_FINGERPRINT }}
        run: pnpm deploy:production

  staging:
    needs: [verify, production]
    # Skipped (not failed) until a repository admin adds the environment secret and turns this on.
    # On pushes it follows a successful production deploy; it only checks the shared schema, never migrates.
    if: >-
      !cancelled() && vars.STAGING_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'push' && needs.verify.result == 'success' && needs.production.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'))
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-production-db
      cancel-in-progress: false
    steps:
      # Always the current master: a run that waited in the queue must not deploy an older commit.
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EMDASH_EXPECTED_TARGET_FINGERPRINT: ${{ vars.EMDASH_TARGET_FINGERPRINT }}
        run: pnpm deploy:staging
